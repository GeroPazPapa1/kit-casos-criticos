name: Actualizar Kit Frio

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-kit-frio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pipeline
        env:
          KEY_OP_FRIO: ${{ secrets.KEY_OP_FRIO }}
          URL_OP_FRIO: ${{ secrets.URL_OP_FRIO }}
          URL_CASOS_CRITICOS: ${{ secrets.URL_CASOS_CRITICOS }}
        run: |
          python pipeline.py

      - name: Commit y push si hubo cambios
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/entregas.parquet
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en los datos."
          else
            git commit -m "chore: auto update kit frio data

Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          cd Dashboard
          vercel --prod --token "$VERCEL_TOKEN" --yes
