name: Actualizar Kit Frio

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-kit-frio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pipeline y exporter
        env:
          KEY_OP_FRIO: ${{ secrets.KEY_OP_FRIO }}
          URL_OP_FRIO: ${{ secrets.URL_OP_FRIO }}
          URL_CASOS_CRITICOS: ${{ secrets.URL_CASOS_CRITICOS }}
        run: |
          python pipeline.py
          python exporter.py

      - name: Commit y push si hubo cambios
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/entregas.parquet Dashboard/public/data/dist/entregas.json Dashboard/public/data/dist/meta.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en los datos."
          else
            git commit -m "chore: auto update kit frio data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug Vercel (sacar cuando ande)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          ls -la Dashboard/.vercel 2>/dev/null && echo ".vercel SIGUE en el checkout (mal)" || echo ".vercel no existe (bien)"
          echo "ORG_ID length: ${#VERCEL_ORG_ID} | prefix: ${VERCEL_ORG_ID:0:5}"
          echo "PROJECT_ID length: ${#VERCEL_PROJECT_ID} | prefix: ${VERCEL_PROJECT_ID:0:4}"
          echo "TOKEN length: ${#VERCEL_TOKEN}"
          npm install -g vercel
          echo "--- whoami ---"
          vercel whoami --token "$VERCEL_TOKEN"

      - name: Deploy a Vercel
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: Dashboard
        run: |
          npm install -g vercel
          vercel --prod --token "$VERCEL_TOKEN" --yes
