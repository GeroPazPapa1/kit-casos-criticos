name: Actualizar datos Operativo Frío

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Evita que dos corridas se pisen si una tarda más de 5 min.
concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pipeline Kit Frío (Kobo -> parquet -> JSON)
        env:
          KEY_OP_FRIO: ${{ secrets.KEY_OP_FRIO }}
          URL_OP_FRIO: ${{ secrets.URL_OP_FRIO }}
        run: |
          python pipeline.py
          python exporter.py

      - name: Pipeline Casos Críticos (Kobo -> JSON)
        env:
          KEY_OP_FRIO: ${{ secrets.KEY_OP_FRIO }}
          URL_CASOS_CRITICOS: ${{ secrets.URL_CASOS_CRITICOS }}
        run: |
          python pipelines/pipeline_casos_criticos.py

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Dashboard/public/data/dist
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "chore: auto update datos operativo frío"
            git push
            echo "Datos actualizados y push hecho. Vercel redeploya automáticamente."
          fi
